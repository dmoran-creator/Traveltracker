name: TravelTracker

# XcodeGen spec: run `xcodegen generate` to produce TravelTracker.xcodeproj.
# The GitHub Actions workflow does this automatically on every push.

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  TravelTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TravelTracker
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Travel Tracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.rpsl.TravelTracker
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
